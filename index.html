<!doctype html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f3f6f7">
    <title>Mening kundaligim — Hayot rejalashtiruvchisi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <style>
        /* ===== 1. Ranglar, joylashuv va telefon ekrani ===== */
        :root {
            color-scheme: light;
            --bg: #f3f6f7;
            --surface: rgba(255, 255, 255, .9);
            --solid: #fff;
            --ink: #17252a;
            --muted: #718087;
            --line: #e3eaeb;
            --accent: #0f766e;
            --mint: #14b8a6;
            --pale: #e5f6f3;
            --shadow: 0 12px 35px rgba(29, 55, 59, .08);
            --radius: 21px
        }

        [data-theme=dark] {
            color-scheme: dark;
            --bg: #1a2332;
            --surface: rgba(37, 49, 66, .93);
            --solid: #202c3b;
            --ink: #edf4f3;
            --muted: #a3b2ba;
            --line: #354354;
            --accent: #2dd4bf;
            --mint: #14b8a6;
            --pale: #203e43;
            --shadow: 0 12px 35px rgba(3, 9, 18, .25)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.55 "Plus Jakarta Sans", Inter, system-ui, sans-serif;
            transition: background .25s, color .25s
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #14b8a6;
            outline-offset: 2px
        }

        .main {
            max-width: 1500px;
            margin: auto;
            padding: 18px 16px 180px
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.7px
        }

        .brandmark {
            width: 37px;
            height: 37px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #0f766e, #20c9ac);
            color: white
        }

        .top-actions {
            display: flex;
            gap: 8px
        }

        .icon-btn,
        .plain-btn {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 13px;
            padding: 9px 12px;
            transition: .18s
        }

        .icon-btn:hover,
        .plain-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow)
        }

        .user-chip {
            width: 39px;
            height: 39px;
            border: 0;
            border-radius: 50%;
            font-weight: 800;
            background: var(--pale);
            color: var(--accent)
        }

        .layout {
            display: grid;
            gap: 20px
        }

        .nav-desktop {
            display: none
        }

        .mobile-nav {
            position: fixed;
            z-index: 20;
            bottom: 8px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: flex-start;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 7px 9px calc(7px + env(safe-area-inset-bottom));
            background: var(--surface);
            backdrop-filter: blur(18px);
            border: 1px solid var(--line);
            border-radius: 21px;
            box-shadow: 0 12px 35px rgba(13, 40, 48, .18)
        }
        .mobile-nav::-webkit-scrollbar { display: none }

        .nav-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            border-radius: 12px;
            padding: 5px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            font-size: 10px;
            min-width: 47px
        }

        .nav-btn .ni {
            font-size: 18px
        }

        .nav-btn.active {
            background: var(--pale);
            color: var(--accent);
            font-weight: 800
        }

        .page {
            animation: enter .28s ease both
        }

        .page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            margin: 4px 0 20px
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 800
        }

        .page-head h1 {
            font-size: clamp(24px, 4vw, 34px);
            letter-spacing: -1.2px;
            line-height: 1.2;
            margin: 5px 0
        }

        .sub {
            margin: 0;
            color: var(--muted)
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 17px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            transition: transform .2s, box-shadow .2s
        }

        .card:hover {
            box-shadow: 0 16px 38px rgba(29, 55, 59, .1)
        }

        .grid {
            display: grid;
            gap: 13px
        }

        .stats-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr))
        }

        .metric {
            min-height: 105px;
            position: relative;
            overflow: hidden
        }

        .metric:after {
            content: "";
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            right: -25px;
            top: -27px;
            background: var(--pale)
        }

        .metric-icon {
            font-size: 20px;
            position: relative
        }

        .metric-value {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-top: 6px
        }

        .metric-label {
            font-size: 11px;
            color: var(--muted)
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 23px;
            background: linear-gradient(115deg, #0d665f, #14a896 70%, #59d1ba);
            color: white;
            border: 0;
            min-height: 182px
        }

        .hero:after {
            content: "";
            position: absolute;
            right: -45px;
            bottom: -105px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 1px solid #ffffff33;
            box-shadow: 0 0 0 25px #ffffff0c, 0 0 0 53px #ffffff09
        }

        .hero h2 {
            font-size: 25px;
            margin: 9px 0 4px;
            letter-spacing: -.7px
        }

        .hero p {
            margin: 0;
            color: #e5fffa
        }

        .date-chip {
            font-size: 11px;
            padding: 5px 10px;
            border: 1px solid #ffffff55;
            border-radius: 20px;
            background: #ffffff1a
        }

        .hero-bottom {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 18px
        }

        .progress-track {
            height: 8px;
            background: #ffffff55;
            border-radius: 99px;
            flex: 1;
            max-width: 290px;
            overflow: hidden
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 99px;
            transition: width .5s
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 0 0 12px
        }

        .section-title h2 {
            font-size: 16px;
            margin: 0;
            letter-spacing: -.3px
        }

        .section-title p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 11px
        }

        .text-btn {
            border: 0;
            background: transparent;
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            padding: 6px
        }

        .dashboard-columns {
            display: grid;
            gap: 13px;
            margin-top: 13px
        }

        .timeline {
            position: relative;
            display: grid;
            gap: 7px
        }

        .timeline:before {
            content: "";
            position: absolute;
            left: 10px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: var(--line)
        }

        .timeline-item {
            display: grid;
            grid-template-columns: 22px 1fr;
            gap: 9px;
            position: relative
        }

        .timeline-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid var(--pale);
            margin: 6px 0 0 5px;
            z-index: 1
        }

        .timeline-item.current .timeline-dot {
            animation: pulse 1.8s infinite
        }

        .timeline-copy {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding-bottom: 9px;
            border-bottom: 1px solid var(--line)
        }

        .timeline-copy strong {
            font-size: 12px
        }

        .timeline-copy small {
            display: block;
            color: var(--muted);
            font-size: 10px
        }

        .timeline-time {
            font-size: 11px;
            color: var(--accent);
            font-weight: 800;
            white-space: nowrap
        }

        .event-list,
        .task-list {
            display: grid;
            gap: 9px
        }

        .event-card {
            display: grid;
            grid-template-columns: 55px 4px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: var(--solid);
            transition: .18s
        }

        .event-card:hover {
            transform: translateY(-2px)
        }

        .event-card[draggable=true] {
            cursor: grab
        }

        .event-card.dragging {
            opacity: .4
        }

        .event-time {
            font-size: 11px;
            font-weight: 800
        }

        .event-bar {
            height: 37px;
            border-radius: 5px;
            background: var(--event-color, var(--accent))
        }

        .event-name {
            font-weight: 800
        }

        .event-meta,
        .task-meta {
            font-size: 10px;
            color: var(--muted)
        }

        .event-actions {
            display: flex
        }

        .small-icon {
            border: 0;
            background: transparent;
            border-radius: 8px;
            padding: 5px;
            color: var(--muted)
        }

        .small-icon:hover {
            background: var(--pale);
            color: var(--accent)
        }

        .badge {
            font-size: 10px;
            font-weight: 800;
            border-radius: 99px;
            padding: 4px 8px;
            background: var(--pale);
            color: var(--accent)
        }

        .task-row {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 11px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--solid)
        }

        .check {
            appearance: none;
            width: 19px;
            height: 19px;
            border: 1.5px solid #a7b5b8;
            border-radius: 6px;
            margin: 2px 0 0;
            flex: none;
            cursor: pointer;
            position: relative
        }

        .check:checked {
            background: var(--accent);
            border-color: var(--accent);
            animation: pop .25s
        }

        .check:checked:after {
            content: "✓";
            position: absolute;
            inset: 0;
            color: #fff;
            text-align: center;
            font-size: 13px;
            font-weight: 800
        }

        .task-copy {
            flex: 1;
            min-width: 0
        }

        .task-copy strong {
            display: block
        }

        .task-copy.done strong {
            text-decoration: line-through;
            color: var(--muted)
        }

        .priority {
            font-size: 9px;
            font-weight: 800;
            padding: 4px 7px;
            border-radius: 8px
        }

        .priority.high {
            color: #a52c22;
            background: #fee4e2
        }

        .priority.medium {
            color: #915300;
            background: #fff0cf
        }

        .priority.low {
            color: #176642;
            background: #ddf6e9
        }

        .empty {
            padding: 25px 12px;
            text-align: center;
            color: var(--muted)
        }

        .empty .emoji {
            display: block;
            font-size: 28px;
            margin-bottom: 6px
        }

        .primary {
            border: 0;
            background: linear-gradient(135deg, var(--accent), var(--mint));
            color: #fff;
            font-weight: 800;
            border-radius: 13px;
            padding: 10px 14px;
            box-shadow: 0 8px 17px #0f766e28;
            transition: .18s
        }

        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px #0f766e38
        }

        .primary:active {
            transform: scale(.97)
        }

        .fab {
            position: fixed;
            z-index: 15;
            right: 17px;
            bottom: 80px;
            width: 54px;
            height: 54px;
            border: 0;
            border-radius: 19px;
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            color: white;
            font-size: 28px;
            box-shadow: 0 11px 25px #0f766e55;
            transition: .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            z-index: 25
        }

        .fab:hover {
            transform: rotate(90deg) scale(1.05)
        }

        .form-grid {
            display: grid;
            gap: 11px
        }

        .field {
            display: grid;
            gap: 5px
        }

        .field label {
            font-size: 10px;
            font-weight: 800;
            color: var(--muted)
        }

        .field input,
        .field select,
        .field textarea,
        .search {
            width: 100%;
            border: 1px solid var(--line);
            background: var(--solid);
            border-radius: 11px;
            padding: 9px 10px;
            min-height: 41px
        }

        .field textarea {
            min-height: 75px;
            resize: vertical
        }

        .inline-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 12px
        }

        .filter-pill {
            border: 1px solid var(--line);
            border-radius: 99px;
            background: var(--solid);
            padding: 7px 10px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700
        }

        .filter-pill.active {
            background: var(--pale);
            color: var(--accent);
            border-color: transparent
        }

        .schedule-week {
            display: grid;
            grid-template-columns: repeat(7, minmax(100px, 1fr));
            gap: 8px;
            overflow: auto;
            padding-bottom: 7px
        }

        .day-column {
            background: var(--solid);
            border: 1px solid var(--line);
            border-radius: 15px;
            padding: 9px;
            min-height: 175px
        }

        .day-column.today {
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent)
        }

        .day-column h3 {
            font-size: 10px;
            margin: 0 0 8px;
            color: var(--muted)
        }

        .lesson {
            border-radius: 11px;
            padding: 8px;
            margin: 6px 0;
            color: #173132;
            background: var(--lesson, #d9f3ee);
            font-size: 10px
        }

        .lesson strong {
            display: block;
            font-size: 10px
        }

        .lesson-time {
            font-size: 9px;
            color: #52696a
        }

        .habit-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 9px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .habit-tabs {
            display: flex;
            gap: 6px;
            overflow: auto
        }

        .habit-tab {
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--solid);
            padding: 7px 9px;
            white-space: nowrap
        }

        .habit-tab.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--pale);
            font-weight: 800
        }

        .heat-scroll {
            overflow: auto;
            padding-bottom: 8px
        }

        .heat-calendar {
            display: grid;
            grid-template-rows: 17px repeat(7, 15px);
            grid-auto-columns: 15px;
            grid-auto-flow: column;
            gap: 4px;
            min-width: max-content
        }

        .month-label {
            grid-row: 1;
            font-size: 9px;
            color: var(--muted);
            align-self: center
        }

        .weekday-label {
            grid-column: 1;
            grid-row: var(--r);
            font-size: 9px;
            color: var(--muted);
            align-self: center;
            position: sticky;
            left: 0;
            background: var(--surface);
            z-index: 1
        }

        .heat-cell {
            grid-row: var(--r);
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: var(--line);
            border: 0;
            padding: 0;
            transition: transform .15s
        }

        .heat-cell:hover {
            transform: scale(1.27)
        }

        .heat-cell.level1 {
            background: #b8e8d9
        }

        .heat-cell.level2 {
            background: #69c9a8
        }

        .heat-cell.level3 {
            background: #24a77f
        }

        .heat-cell.level4 {
            background: #08705d
        }

        .heat-legend {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--muted);
            font-size: 9px
        }

        .calendar-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 7px;
            margin-bottom: 13px
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px
        }

        .cal-weekday {
            text-align: center;
            color: var(--muted);
            font-size: 9px;
            font-weight: 800;
            padding: 5px 0
        }

        .cal-day {
            min-height: 53px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--solid);
            padding: 5px;
            position: relative;
            text-align: left
        }

        .cal-day.muted {
            opacity: .4
        }

        .cal-day.today {
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 800
        }

        .cal-day.selected {
            background: var(--pale)
        }

        .cal-day .dots {
            position: absolute;
            bottom: 5px;
            left: 6px;
            display: flex;
            gap: 3px
        }

        .cal-day .dots i {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent)
        }

        .month-select {
            display: flex;
            align-items: center;
            gap: 7px
        }

        .month-select strong {
            min-width: 105px;
            text-align: center;
            font-size: 12px
        }

        .week-layout {
            display: grid;
            gap: 7px
        }

        .timer-face {
            width: min(235px, 65vw);
            aspect-ratio: 1;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: 14px auto 18px;
            background: conic-gradient(var(--accent) var(--timer-pct, 100%), var(--line) 0);
            position: relative
        }

        .timer-face:before {
            content: "";
            position: absolute;
            inset: 11px;
            border-radius: 50%;
            background: var(--solid)
        }

        .timer-content {
            position: relative;
            text-align: center
        }

        .timer-content strong {
            font-size: 40px;
            letter-spacing: -2px;
            display: block
        }

        .timer-content small {
            color: var(--muted);
            font-weight: 800
        }

        .timer-controls,
        .timer-settings {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .timer-settings {
            margin: 12px 0
        }

        .calc {
            max-width: 500px;
            margin: auto
        }

        .calc-display {
            background: var(--solid);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
            text-align: right;
            margin-bottom: 9px;
            min-height: 78px;
            overflow: hidden
        }

        .calc-history {
            color: var(--muted);
            font-size: 11px;
            min-height: 18px
        }

        .calc-result {
            font-weight: 800;
            font-size: 28px;
            overflow-wrap: anywhere
        }

        .calc-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px
        }

        .calc-key {
            border: 1px solid var(--line);
            background: var(--solid);
            border-radius: 11px;
            min-height: 47px;
            font-weight: 700
        }

        .calc-key:hover {
            background: var(--pale);
            color: var(--accent)
        }

        .calc-key.op {
            color: var(--accent);
            background: var(--pale)
        }

        .calc-key.equal {
            background: var(--accent);
            color: white
        }

        .calc-tabs {
            display: flex;
            gap: 5px;
            overflow: auto;
            margin-bottom: 11px
        }

        .calc-tab {
            white-space: nowrap
        }

        .chart-wrap {
            height: 195px
        }

        .chart-wrap svg {
            width: 100%;
            height: 100%;
            overflow: visible
        }

        .settings-list {
            display: grid;
            gap: 8px
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line)
        }

        .setting-row:last-child {
            border: 0
        }

        .setting-info strong {
            display: block
        }

        .setting-info small {
            color: var(--muted)
        }

        .switch {
            width: 44px;
            height: 25px;
            appearance: none;
            border-radius: 20px;
            background: var(--line);
            position: relative;
            cursor: pointer
        }

        .switch:checked {
            background: var(--accent)
        }

        .switch:after {
            content: "";
            position: absolute;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: white;

        function chatWire() {
            const panel = $("#chatPanel"), toggle = $("#chatToggle"), input = $("#chatInput");
            const setOpen = open => { panel.hidden = !open; toggle.setAttribute("aria-expanded", String(open)); if (open) { updateChatLabels(); if (!$("#chatMessages").children.length) addChatMessage("assistant", chatText().welcome); input.focus() } };
            toggle.addEventListener("click", () => setOpen(panel.hidden));
            $("#chatClose").addEventListener("click", () => { setOpen(false); toggle.focus() });
            $("#chatForm").addEventListener("submit", async event => {
                event.preventDefault();
                const message = input.value.trim();
                if (!message || message.length > 500 || $("#chatSend").disabled) return;
                const labels = chatText();
                addChatMessage("user", message);
                input.value = "";
                const pending = addChatMessage("assistant", labels.pending);
                $("#chatSend").disabled = true;
                input.disabled = true;
                try {
                    const endpoint = location.protocol === "file:" ? "http://localhost:3000/api/chat" : "/api/chat";
                    const response = await fetch(endpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message, lang: state.lang, page, profile: state.profile, history: chatHistory.slice(-8) })
                    });
                    const data = await response.json();
                    if (!response.ok || typeof data.reply !== "string" || !data.reply) throw new Error(response.status === 429 ? "rate-limit" : response.status === 503 ? "service-unavailable" : "request-failed");
                    pending.textContent = data.reply;
                    chatHistory.push({ role: "user", content: message }, { role: "assistant", content: data.reply });
                    if (chatHistory.length > 8) chatHistory.splice(0, chatHistory.length - 8);
                } catch (error) {
                    if (error.message === "rate-limit") pending.textContent = labels.limit;
                    else {
                        console.warn("Kunora assistant server unavailable; using local help fallback.");
                        pending.textContent = localChatReply(message);
                        chatHistory.push({ role: "user", content: message }, { role: "assistant", content: pending.textContent });
                        if (chatHistory.length > 8) chatHistory.splice(0, chatHistory.length - 8);
                    }
                } finally {
                    $("#chatSend").disabled = false;
                    input.disabled = false;
                    input.focus();
                }
            });
            updateChatLabels();

        function tasksPage() {

            return `${head(t("tasks"), `${state.tasks.filter(task => task.done).length} ${t("completed")} · ${state.tasks.length}`, `<button class="primary" data-add="task">+ ${esc(t("addTask"))}</button>`)}<section class="card"><div class="filter-row">${["all", "open", "done"].map(filter => `<button class="filter-pill ${taskFilter === filter ? "active" : ""}" data-task-filter="${filter}">${esc(t(filter === "all" ? "all" : filter === "done" ? "completed" : "openTasks"))}</button>`).join("")}<input class="search" id="taskSearch" placeholder="${esc(t("search"))}" value="${esc(taskSearch)}" style="max-width:200px"></div><div class="task-list">${tasks.map(taskRow).join("") || empty("✅", t("emptyTasks"))}</div></section>`;
        }
        const originalAction = action;
        action = function (name) {
            originalAction(name);
            if (name === "start-focus") window.__kunoraTimerDeadline = Date.now() + timerSeconds * 1000;
        };
        document.addEventListener("keydown", event => {
            if (page === "calculator" && event.key === "Enter" && event.target instanceof Element && event.target.closest(".calc-key")) {
                event.preventDefault(); event.stopImmediatePropagation(); pressCalc("=");
            }
        }, true);
        async function boot() {
            theme(); globalWire(); chatWire();
            document.addEventListener("keydown", event => {
                if (event.key === "Escape" && !$("#chatPanel").hidden) { $("#chatPanel").hidden = true; $("#chatToggle").setAttribute("aria-expanded", "false"); $("#chatToggle").focus(); }
            }, true);
            document.addEventListener("visibilitychange", () => { if (!document.hidden) { updateLiveUI(); if (timerRunning) tick(); } });
            await showSplash(); nav();
            if (!state.profile) profileModal(); else { page = "start"; render(); }
            if (startupNormalized.dropped) toast(`${startupNormalized.dropped} ${t("invalidRecords")}`);
            if (matchMedia("(prefers-color-scheme: dark)").addEventListener) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.theme === "system") theme(); });
            setInterval(checkReminders, 30000); setInterval(() => { if (!document.hidden) updateLiveUI(); }, 1000);
        }
        boot();
    </script>
</body>

</html>
